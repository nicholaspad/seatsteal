services:
  test-db:
    image: postgres:15-alpine
    container_name: seatsteal-test-db
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: seatsteal_test
    ports:
      - "5433:5432"  # Use 5433 to avoid conflicts with local postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d seatsteal_test"]
      interval: 2s
      timeout: 5s
      retries: 10
    tmpfs:
      - /var/lib/postgresql/data  # Use tmpfs for faster tests
    # Enable pg_trgm extension for trigram indexes
    command: >
      postgres
      -c shared_preload_libraries=''
    volumes:
      - ./init-test-db.sql:/docker-entrypoint-initdb.d/init.sql:ro

  tests:
    build:
      context: .
      dockerfile: Dockerfile.test
    container_name: seatsteal-tests
    environment:
      # Override the test database URL to point to the docker postgres
      TEST_DATABASE_URL: postgresql+psycopg2://test:test@test-db:5432/seatsteal_test
      DATABASE_URL: postgresql://test:test@test-db:5432/seatsteal_test
      VITE_SUPABASE_URL: https://test.supabase.co
      VITE_SUPABASE_ANON_KEY: test_anon_key
      SUPABASE_SERVICE_ROLE_KEY: test_key
      FRONTEND_URL: http://localhost:3000
      STRIPE_SECRET_KEY: sk_test_123
      STRIPE_WEBHOOK_SECRET: whsec_test_123
      PYTHON_ENV: test
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test_access_key
      AWS_SECRET_ACCESS_KEY: test_secret_key
      AWS_SES_FROM_EMAIL: test@example.com
      TWILIO_ACCOUNT_SID: ""
      TWILIO_AUTH_TOKEN: ""
      TWILIO_FROM_NUMBER: ""
    depends_on:
      test-db:
        condition: service_healthy
    volumes:
      - ./:/webapp
    # Allow passing extra pytest args via command line
    # e.g., docker compose -f docker-compose.test.yml run tests pytest tests/test_routes/ -v
    command: ["pytest", "--tb=short"]
