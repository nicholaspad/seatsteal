[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow running tests
addopts =
    -v
    --strict-markers
    --cov=.
    --cov-report=term-missing:skip-covered
    --cov-report=html
    --cov-report=json
    --cov-config=.coveragerc
