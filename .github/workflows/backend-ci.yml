name: Backend CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'webapp/**'
      - '.github/workflows/backend-ci.yml'
  push:
    branches: [main]
    paths:
      - 'webapp/**'
      - '.github/workflows/backend-ci.yml'

jobs:
  test:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webapp

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and run tests with coverage
        run: docker compose -f docker-compose.test.yml up --build --abort-on-container-exit --exit-code-from tests

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: |
            webapp/htmlcov/
            webapp/.coverage
          retention-days: 30

      - name: Coverage summary
        if: always()
        run: |
          if [ -f .coverage ]; then
            echo "## Backend Coverage Summary" >> $GITHUB_STEP_SUMMARY
            echo "Coverage reports generated successfully" >> $GITHUB_STEP_SUMMARY
            if [ -d htmlcov ]; then
              echo "HTML coverage report available in artifacts" >> $GITHUB_STEP_SUMMARY
            fi
          fi

      - name: Clean up Docker resources
        if: always()
        run: docker compose -f docker-compose.test.yml down -v
