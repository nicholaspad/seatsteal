    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "SeatSteal",
        "applicationCategory": "EducationalApplication",
        "operatingSystem": "Web",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        },
        "description": "Track full college classes and get instant email or SMS notifications when seats become available. Never miss a spot in your desired course again.",
        "aggregateRating": {
          "@type": "AggregateRating",
          "ratingValue": "5",
          "ratingCount": "1"
        }
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "How does SeatSteal work?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Add courses to your watchlist, and SeatSteal automatically tracks class availability. When a seat opens up in a full class, you'll receive an instant notification via email or SMS so you can register before the spot fills up again."
            }
          },
          {
            "@type": "Question",
            "name": "Can I monitor multiple courses at once?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes! Free users can track 1 course, Plus users ($2/month) can track 5 courses, and Pro users ($5/month) can track 20 courses simultaneously."
            }
          },
          {
            "@type": "Question",
            "name": "What types of notifications does SeatSteal send?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "SeatSteal sends instant email notifications on all plans. Plus and Pro plans also include SMS text message alerts for faster notification when a seat opens up."
            }
          },
          {
            "@type": "Question",
            "name": "Is my information secure?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. We collect only the information needed to send notifications and never ask for your university credentials."
            }
          }
        ]
      }
    </script>
