    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "SeatSteal",
      "applicationCategory": "EducationalApplication",
      "operatingSystem": "Web",
      "description": "Course enrollment notification service that monitors class availability and sends instant alerts when seats open at your university.",
      "url": "https://seatsteal.com",
      "offers": [
        {
          "@type": "Offer",
          "name": "Free",
          "price": "0",
          "priceCurrency": "USD",

        },
        {
          "@type": "Offer",
          "name": "Plus",
          "price": "2",
          "priceCurrency": "USD",
          "priceValidUntil": "2025-12-31",
          "description": "Monitor 5 sections with email + SMS notifications and analytics"
        },
        {
          "@type": "Offer",
          "name": "Pro",
          "price": "5",
          "priceCurrency": "USD",
          "priceValidUntil": "2025-12-31",

    <!-- Organization Schema -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",

      "sameAs": []
    }

    <!-- WebSite Schema with Sitelinks Search Box -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "SeatSteal",
      "url": "https://seatsteal.com",
      "description": "Course enrollment notification service - get notified when seats open",
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://seatsteal.com/courses?q={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      }
    }
    </script>
    
    <!-- Site Navigation Schema for Sitelinks -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "SiteNavigationElement",
          "name": "Courses",
          "description": "Browse and search available courses at your university",
          "url": "https://seatsteal.com/courses"
        },
        {
          "@type": "SiteNavigationElement",
          "name": "Pricing",
          "description": "View pricing plans - Free, Plus ($2/mo), and Pro ($5/mo)",
          "url": "https://seatsteal.com/#pricing"
        },
        {
          "@type": "SiteNavigationElement",
          "name": "Login",
          "description": "Sign in to your SeatSteal account",
          "url": "https://seatsteal.com/login"
        }
      ]
    }
    </script>
    
    <!-- FAQ Schema for rich snippets -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "How does SeatSteal work?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Subscribe to classes, and SeatSteal continually monitors enrollment status and notifies you when seats become available."
          }
        },
        {
          "@type": "Question",
          "name": "Which universities does SeatSteal support?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "SeatSteal currently supports Brown University, Cornell University, University of Pennsylvania, USC, Northeastern University, Rutgers University, Boston University, and University of Maryland."
          }
        },
        {
          "@type": "Question",
          "name": "Can I monitor multiple courses at once?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Free users can subscribe to 1 course, Plus users can subscribe to 5 courses, and Pro users can subscribe to 20 courses."
          }
        },
        {
          "@type": "Question",
          "name": "Is SeatSteal free?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes! SeatSteal offers a free tier that allows you to monitor 1 section with email notifications. Paid plans start at $2/month for additional features like SMS notifications and faster checking intervals."
          }
        },
        {
          "@type": "Question",
          "name": "Can I cancel my subscription anytime?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes, you can cancel your subscription at any time. You'll maintain access until the end of your billing period."
          }
        }
      ]
    }
    </script>
